name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: Generated code is up to date
        run: |
          sqlc generate
          go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi/openapi.yaml
          git diff --exit-code -- internal/store internal/api/gen
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend
      - name: Test (with Postgres via testcontainers)
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: backend, args: "CMD=api" }
          - { name: worker, context: backend, args: "CMD=worker" }
          - { name: migrate, context: backend, args: "CMD=migrate" }
          - { name: web, context: web, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only for now; push to a registry once one is chosen (docs/PLAN.md §11).
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          push: false
          tags: teatchable/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
